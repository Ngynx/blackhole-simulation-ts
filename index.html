<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Black Hole — Gravitational Lensing</title>
    <style>
      :root {
        color-scheme: dark;

        /* Page chrome colours -- one custom property per Style.ui field
           (src/render/style.ts). The values below are REALISTIC.ui verbatim,
           so the default load renders byte-identically to the hard-coded
           colours this block replaced; uiStyle.test.ts parses this file and
           fails if they ever drift. applyUiStyle() (src/render/uiStyle.ts)
           rewrites all of them from the active style at startup and on every
           s/c switch.

           --bh-panel-veil is --bh-panel at 92% alpha: the status banner
           floats over the canvas and stays slightly translucent, exactly as
           the old rgba(10, 12, 18, 0.92) literal did. */
        --bh-background: #05070c;
        --bh-panel: #0a0c12;
        --bh-panel-veil: rgba(10, 12, 18, 0.92);
        --bh-border: #1d222d;
        --bh-text: #8b93a7;
        --bh-muted: #4d5568;
        --bh-ok: #57d99a;
        --bh-fail: #ff7b72;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bh-background);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #view {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }

      /* Capability banner: reports whether WebGPU is usable before anything renders. */
      #status {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        padding: 6px 12px;
        font-size: 12px;
        letter-spacing: 0.02em;
        background: var(--bh-panel-veil);
        border-bottom: 1px solid var(--bh-border);
        color: var(--bh-text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* The two border accents below are the only chrome colours outside
         Style.ui: static companions of the ok/fail text, kept as literals on
         purpose (they are not part of the styled palette). */
      #status.ok {
        color: var(--bh-ok);
        border-bottom-color: #16352a;
      }
      #status.fail {
        color: var(--bh-fail);
        border-bottom-color: #3d1f1d;
      }

      /* Full-screen blocker used when a WebGPU-only mode is requested on a
         browser that cannot provide WebGPU. */
      #fallback {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: var(--bh-background);
        color: var(--bh-fail);
        font-size: 15px;
        line-height: 1.6;
        text-align: center;
      }
      #fallback:empty {
        display: none;
      }

      #hint {
        position: fixed;
        left: 12px;
        bottom: 10px;
        z-index: 10;
        font-size: 11px;
        color: var(--bh-muted);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="status" role="status">Checking WebGPU…</div>
    <canvas id="view"></canvas>
    <div id="hint"></div>
    <div id="fallback"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
