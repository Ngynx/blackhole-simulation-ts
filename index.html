<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Black Hole — Gravitational Lensing</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05070c;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #view {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }

      /* Capability banner: reports whether WebGPU is usable before anything renders. */
      #status {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        padding: 6px 12px;
        font-size: 12px;
        letter-spacing: 0.02em;
        background: rgba(10, 12, 18, 0.92);
        border-bottom: 1px solid #1d222d;
        color: #8b93a7;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #status.ok {
        color: #57d99a;
        border-bottom-color: #16352a;
      }
      #status.fail {
        color: #ff7b72;
        border-bottom-color: #3d1f1d;
      }

      /* Full-screen blocker used when a WebGPU-only mode is requested on a
         browser that cannot provide WebGPU. */
      #fallback {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: #05070c;
        color: #ff7b72;
        font-size: 15px;
        line-height: 1.6;
        text-align: center;
      }
      #fallback:empty {
        display: none;
      }

      #hint {
        position: fixed;
        left: 12px;
        bottom: 10px;
        z-index: 10;
        font-size: 11px;
        color: #4d5568;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="status" role="status">Checking WebGPU…</div>
    <canvas id="view"></canvas>
    <div id="hint"></div>
    <div id="fallback"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
